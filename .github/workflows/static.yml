name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check business-engine.js
          node --check data-normalization.js
          node --check business-engine-adapter.js
          node --check decision-ui.js
          node --check auth-persist.js
          node --check sunny-theme.js
          node --check analytics.js
          node --check class-ops.js
          node --check bulk-payment.js
          node --check chart-interactions.js
          node --check dashboard-layout.js

      - name: Test canonical business rules
        run: node tests/business-engine.test.js

      - name: Test normalized data layer
        run: node tests/data-normalization.test.js

      - name: Guard runtime composition
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          forbidden=['rent-rule.js','profit-fix.js','finance-breakdown.js','finance-pro.js','recipe-costing-fix.js','upcoming-labels.js']
          found=[x for x in forbidden if x in html]
          if found:
              raise SystemExit('Legacy calculation modules are still loaded: '+', '.join(found))
          required=['business-engine.js','data-normalization.js','business-engine-adapter.js','decision-ui.js','decision-ui.css']
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('Required runtime module missing: '+', '.join(missing))
          print('runtime composition guard passed')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5