# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad = ".sort((a,b)=>({missing:0,partial:1,final:2}[group(a)]-({missing:0,partial:1,final:2}[group(b)])||a.name.localeCompare(b.name,'ko'));"
          good = ".sort((a,b)=>({missing:0,partial:1,final:2}[group(a)]-({missing:0,partial:1,final:2}[group(b)]))||a.name.localeCompare(b.name,'ko'));"
          if bad in s:
              s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Link recipe aliases
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function recipeOf(x){return recipes.find(r=>r.name===x)||null}"
          new = "function recipeOf(x){const aliases={'꾸덕브라우니':'브라우니','크랙소금빵':'소금빵','크랙소금빵 원데이':'소금빵'};return recipes.find(r=>r.name===x)||recipes.find(r=>r.name===aliases[x])||null}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('class-ops.js')
          s = p.read_text(encoding='utf-8')
          old = "return (recipes || []).find(r => r.name === name) || null;"
          new = "const aliases = {'꾸덕브라우니':'브라우니','크랙소금빵':'소금빵','크랙소금빵 원데이':'소금빵'}; return (recipes || []).find(r => r.name === name) || (recipes || []).find(r => r.name === aliases[name]) || null;"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('profit-fix.js')
          s = p.read_text(encoding='utf-8')
          old = "const names = [raw?.menu, raw?.recipeCandidate].filter(Boolean);"
          new = "const aliases = {'꾸덕브라우니':'브라우니','크랙소금빵':'소금빵','크랙소금빵 원데이':'소금빵'}; const names = [raw?.menu, raw?.recipeCandidate, aliases[raw?.menu], aliases[raw?.classTitle]].filter(Boolean);"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('upcoming-labels.js')
          s = p.read_text(encoding='utf-8')
          old = "const r = (recipes || []).find(x => x.name === name) || null;"
          new = "const aliases = {'꾸덕브라우니':'브라우니','크랙소금빵':'소금빵','크랙소금빵 원데이':'소금빵'}; const r = (recipes || []).find(x => x.name === name) || (recipes || []).find(x => x.name === aliases[name]) || null;"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add persistent auth UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./auth-persist.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Sunny's Atelier light and dark themes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          boot = '''<script>(function(){try{var k='sunny-atelier-color-mode';var v=localStorage.getItem(k);var m=v||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.dataset.theme=m;document.documentElement.style.colorScheme=m;}catch(e){}})();</script>'''
          css = '<link rel="stylesheet" href="./sunny-theme.css?v=20260829-dark1">'
          dark = '<link rel="stylesheet" href="./sunny-dark.css?v=20260829-dark1">'
          js = '<script src="./sunny-theme.js?v=20260829-dark1"></script>'
          if boot not in s:
              s = s.replace('</head>', boot + css + dark + '</head>')
          else:
              if css not in s:
                  s = s.replace('</head>', css + '</head>')
              if dark not in s:
                  s = s.replace('</head>', dark + '</head>')
          if js not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add embedded analytics and visualizations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./analytics.css?v=20260829-a2">'
          js = '<script src="./analytics.js?v=20260829-a2"></script>'
          if css not in s:
              s = s.replace('</head>', css + '</head>')
          if js not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add class payments and profitability planning
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./class-ops.css?v=20260830-ops3">'
          js = '<script src="./class-ops.js?v=20260830-ops3"></script>'
          if css not in s:
              s = s.replace('</head>', css + '</head>')
          if js not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Fix completed-class profit calculations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          js = '<script src="./profit-fix.js?v=20260830-profit3"></script>'
          if js not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Label upcoming class metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./upcoming-labels.css?v=20260830-up3">'
          js = '<script src="./upcoming-labels.js?v=20260830-up3"></script>'
          if css not in s:
              s = s.replace('</head>', css + '</head>')
          if js not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Organize dashboard layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./dashboard-layout.css?v=20260830-d3">'
          js = '<script src="./dashboard-layout.js?v=20260830-d3"></script>'
          if css not in s:
              s = s.replace('</head>', css + '</head>')
          if js not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add bulk payment and interactive monthly chart
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./chart-interactions.css?v=20260830-paychart2">'
          pay = '<script src="./bulk-payment.js?v=20260830-paychart2"></script>'
          chart = '<script src="./chart-interactions.js?v=20260830-paychart2"></script>'
          if css not in s:
              s = s.replace('</head>', css + '</head>')
          if pay not in s:
              s = s.replace('</body>', pay + '</body>')
          if chart not in s:
              s = s.replace('</body>', chart + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>', html, flags=re.S|re.I):
              if 'src=' not in m.group(1).lower():
                  scripts.append(m.group(2))
          if not scripts:
              raise SystemExit('No inline dashboard script found')
          Path('/tmp/dashboard-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          for name in ('bulk-payment.js','dashboard-layout.js'):
              if 'MutationObserver' in Path(name).read_text(encoding='utf-8'):
                  raise SystemExit(f'Unsafe DOM observer found in {name}')
          PY
          node --check /tmp/dashboard-inline.js
          node --check auth-persist.js
          node --check sunny-theme.js
          node --check analytics.js
          node --check class-ops.js
          node --check profit-fix.js
          node --check upcoming-labels.js
          node --check dashboard-layout.js
          node --check bulk-payment.js
          node --check chart-interactions.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
