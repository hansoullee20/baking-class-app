# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad = ".sort((a,b)=>({missing:0,partial:1,final:2}[group(a)]-({missing:0,partial:1,final:2}[group(b)])||a.name.localeCompare(b.name,'ko'));"
          good = ".sort((a,b)=>({missing:0,partial:1,final:2}[group(a)]-({missing:0,partial:1,final:2}[group(b)]))||a.name.localeCompare(b.name,'ko'));"
          if bad in s:
              s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add persistent auth UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./auth-persist.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Sunny's Atelier light and dark themes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          boot = '''<script>(function(){try{var k='sunny-atelier-color-mode';var v=localStorage.getItem(k);var m=v||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.dataset.theme=m;document.documentElement.style.colorScheme=m;}catch(e){}})();</script>'''
          css = '<link rel="stylesheet" href="./sunny-theme.css?v=20260829-dark1">'
          dark = '<link rel="stylesheet" href="./sunny-dark.css?v=20260829-dark1">'
          js = '<script src="./sunny-theme.js?v=20260829-dark1"></script>'
          if boot not in s:
              s = s.replace('</head>', boot + css + dark + '</head>')
          else:
              if css not in s:
                  s = s.replace('</head>', css + '</head>')
              if dark not in s:
                  s = s.replace('</head>', dark + '</head>')
          if js not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>', html, flags=re.S|re.I):
              if 'src=' not in m.group(1).lower():
                  scripts.append(m.group(2))
          if not scripts:
              raise SystemExit('No inline dashboard script found')
          Path('/tmp/dashboard-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/dashboard-inline.js
          node --check auth-persist.js
          node --check sunny-theme.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
