name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check business-engine.js
          node --check data-normalization.js
          node --check business-engine-adapter.js
          node --check operations-ui.js
          node --check management-planner.js
          node --check calendar-class-editor.js
          node --check calendar-status.js
          node --check information-architecture.js
          node --check workspace-refinement.js
          node --check recipe-ingredient-costs.js
          node --check finance-ledger-detail.js
          node --check finance-ledger-canonical.js
          node --check finance-unified.js
          node --check cost-review-queue.js
          node --check stability-runtime.js
          node --check auth-persist.js
          node --check sunny-theme.js
          node --check class-ops-canonical.js
          node --check bulk-payment.js

      - name: Test canonical business rules
        run: node tests/business-engine.test.js

      - name: Test normalized data layer
        run: node tests/data-normalization.test.js

      - name: Test finance aggregation invariants
        run: node tests/finance-ledger-canonical.test.js

      - name: Test runtime architecture
        run: node tests/runtime-architecture.test.js

      - name: Test stability runtime
        run: node tests/stability-runtime.test.js

      - name: Guard runtime and repository composition
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          status=Path('calendar-status.js').read_text(encoding='utf-8')
          ia=Path('information-architecture.js').read_text(encoding='utf-8')
          ia_css=Path('information-architecture.css').read_text(encoding='utf-8')
          refine=Path('workspace-refinement.js').read_text(encoding='utf-8')
          refine_css=Path('workspace-refinement.css').read_text(encoding='utf-8')
          recipe_costs=Path('recipe-ingredient-costs.js').read_text(encoding='utf-8')
          ledger=Path('finance-ledger-canonical.js').read_text(encoding='utf-8')
          ledger_css=Path('finance-ledger-detail.css').read_text(encoding='utf-8')
          canonical_css=Path('finance-ledger-canonical.css').read_text(encoding='utf-8')
          unified=Path('finance-unified.js').read_text(encoding='utf-8')
          unified_css=Path('finance-unified.css').read_text(encoding='utf-8')
          deprecated=[
            'rent-rule.js','profit-fix.js','finance-breakdown.js','finance-breakdown.css',
            'finance-pro.js','finance-pro.css','recipe-costing-fix.js','recipe-costing.js','recipe-costing.css',
            'upcoming-labels.js','upcoming-labels.css','analytics.js','analytics.css',
            'dashboard-layout.js','dashboard-layout.css','chart-interactions.js','chart-interactions.css',
            'decision-ui.js','monthly-forecast.js','monthly-forecast.css','tablet-profit-fix.css','class-ops.js'
          ]
          loaded=[x for x in deprecated if x in html]
          existing=[x for x in deprecated if Path(x).exists()]
          if loaded: raise SystemExit('Deprecated modules are loaded: '+', '.join(loaded))
          if existing: raise SystemExit('Deprecated files reintroduced: '+', '.join(existing))
          required=['business-engine.js','data-normalization.js','business-engine-adapter.js','operations-ui.js','management-planner.js','calendar-class-editor.js','calendar-status.js','information-architecture.js','workspace-refinement.js','recipe-ingredient-costs.js','finance-ledger-canonical.js','finance-unified.js','cost-review-queue.js','stability-runtime.js','class-ops-canonical.js','decision-ui.css','operations-ui.css','management-polish.css','calendar-class-editor.css','calendar-status.css','information-architecture.css','workspace-refinement.css','recipe-ingredient-costs.css','finance-ledger-detail.css','finance-ledger-canonical.css','finance-unified.css']
          missing=[x for x in required if x not in html or not Path(x).exists()]
          if missing: raise SystemExit('Required runtime asset missing from index: '+', '.join(missing))
          if 'information-architecture.js' in status: raise SystemExit('Calendar status must not dynamically load information architecture')
          if 'dayOpsModal' not in ia or 'data-day-edit' not in ia or 'data-person="paymentStatus"' not in ia: raise SystemExit('Unified calendar day manager is incomplete')
          if '#calendar #calendarClassDetail' not in ia_css or '#dashboard #operationsDashboard' not in ia_css: raise SystemExit('Duplicate legacy surfaces are not suppressed')
          if "validCategories=['빵류','디저트류','케이크류']" not in refine or 'data-quick-paid' not in refine or 'recipe-process-details' not in refine or 'dayops-advanced' not in refine: raise SystemExit('Minimal recipe/calendar workspace is incomplete')
          if 'renderOperatingFlow' in refine: raise SystemExit('Workspace refinement must not own a duplicate finance dashboard')
          if '.recipe-process-details' not in refine_css or '.dayops-advanced' not in refine_css: raise SystemExit('Progressive disclosure styles are incomplete')
          if 'usageCalc' not in recipe_costs or 'price_per_100g' not in recipe_costs or '재료별 계산 합계' not in recipe_costs: raise SystemExit('Recipe ingredient cost detail is incomplete')
          if '저장된 레시피 원가' in recipe_costs: raise SystemExit('Recipe total cost is repeated inside expanded ingredient details')
          if 'B.classFinancials' not in ledger or 'avgClassProfit' not in ledger or 'avgStudentProfit' not in ledger or 'costablePeople' not in ledger: raise SystemExit('Finance unit economics are incomplete')
          if "timeZone:'Asia/Seoul'" not in ledger or 'function occurred' not in ledger: raise SystemExit('Finance current-state cutoff is incomplete')
          if "flowCard('current'" not in ledger or "flowCard('forecast'" not in ledger: raise SystemExit('Current and forecast finance flows must both exist')
          if 'shiftMonth(cur,-1)' not in ledger or 'data-compare-month' not in ledger or 'function comparePanel' not in ledger: raise SystemExit('Previous-month-first comparison is incomplete')
          if 'data-fin-menu' not in ledger or 'function menuPanel' not in ledger or 'function classDetails' not in ledger: raise SystemExit('Finance profitability or drill-down is incomplete')
          if 'knownCost' not in ledger or 'fullProfit' not in ledger or 'missingCostCount' not in ledger: raise SystemExit('Finance incomplete-cost aggregation safeguards are missing')
          if '원가가 없는 수업도 대관비' not in ledger: raise SystemExit('Finance known fixed-cost policy is not visible in the canonical owner')
          if '.finance-cash-strip' not in canonical_css or '.finance-partial-scope' not in canonical_css: raise SystemExit('Canonical finance scope styles are incomplete')
          if 'function moneyFlow(' in ledger or 'function monthlyFlowPanel' in ledger: raise SystemExit('Legacy past-first finance surfaces reintroduced')
          if '.finance-focus-grid' not in ledger_css or '.focus-flow-card' not in ledger_css or '.flow-stack' not in ledger_css or '.month-selector' not in ledger_css or '.compare-metrics' not in ledger_css or '.finance-detail-shell' not in ledger_css: raise SystemExit('Current-month finance visual hierarchy styles are incomplete')
          if 'finance-supercard' not in unified or '.finance-supercard' not in unified_css or '.focus-flow-card>.flow-stack' not in unified_css: raise SystemExit('Unified finance visualization is incomplete')
          if '<button data-page="schedule">' in html or '<button data-page="planner">' in html: raise SystemExit('Duplicate planner/schedule navigation reintroduced')
          if Path('docs/index.html').exists(): raise SystemExit('Obsolete duplicate docs/index.html must not be restored')
          print('Canonical finance workspace guard passed')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
