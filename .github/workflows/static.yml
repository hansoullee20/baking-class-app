name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check business-engine.js
          node --check data-normalization.js
          node --check business-engine-adapter.js
          node --check operations-ui.js
          node --check management-planner.js
          node --check calendar-class-editor.js
          node --check calendar-status.js
          node --check information-architecture.js
          node --check workspace-refinement.js
          node --check recipe-ingredient-costs.js
          node --check finance-ledger-detail.js
          node --check auth-persist.js
          node --check sunny-theme.js
          node --check class-ops-canonical.js
          node --check bulk-payment.js

      - name: Test canonical business rules
        run: node tests/business-engine.test.js

      - name: Test normalized data layer
        run: node tests/data-normalization.test.js

      - name: Test runtime architecture
        run: node tests/runtime-architecture.test.js

      - name: Guard runtime and repository composition
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          status=Path('calendar-status.js').read_text(encoding='utf-8')
          ia=Path('information-architecture.js').read_text(encoding='utf-8')
          css=Path('information-architecture.css').read_text(encoding='utf-8')
          refine=Path('workspace-refinement.js').read_text(encoding='utf-8')
          refine_css=Path('workspace-refinement.css').read_text(encoding='utf-8')
          recipe_costs=Path('recipe-ingredient-costs.js').read_text(encoding='utf-8')
          ledger=Path('finance-ledger-detail.js').read_text(encoding='utf-8')
          ledger_css=Path('finance-ledger-detail.css').read_text(encoding='utf-8')
          deprecated=[
            'rent-rule.js','profit-fix.js','finance-breakdown.js','finance-breakdown.css',
            'finance-pro.js','finance-pro.css','recipe-costing-fix.js','recipe-costing.js','recipe-costing.css',
            'upcoming-labels.js','upcoming-labels.css','analytics.js','analytics.css',
            'dashboard-layout.js','dashboard-layout.css','chart-interactions.js','chart-interactions.css',
            'decision-ui.js','monthly-forecast.js','monthly-forecast.css','tablet-profit-fix.css','class-ops.js'
          ]
          loaded=[x for x in deprecated if x in html]
          existing=[x for x in deprecated if Path(x).exists()]
          if loaded:
              raise SystemExit('Deprecated modules are loaded: '+', '.join(loaded))
          if existing:
              raise SystemExit('Deprecated files reintroduced: '+', '.join(existing))
          required=['business-engine.js','data-normalization.js','business-engine-adapter.js','operations-ui.js','management-planner.js','calendar-class-editor.js','calendar-status.js','information-architecture.js','workspace-refinement.js','recipe-ingredient-costs.js','finance-ledger-detail.js','class-ops-canonical.js','decision-ui.css','operations-ui.css','management-polish.css','calendar-class-editor.css','calendar-status.css','information-architecture.css','workspace-refinement.css','recipe-ingredient-costs.css','finance-ledger-detail.css']
          missing=[x for x in required if x not in html or not Path(x).exists()]
          if missing:
              raise SystemExit('Required runtime asset missing from index: '+', '.join(missing))
          if 'information-architecture.js' in status:
              raise SystemExit('Calendar status must not dynamically load information architecture')
          if 'dayOpsModal' not in ia or 'data-day-edit' not in ia or 'data-person="paymentStatus"' not in ia:
              raise SystemExit('Unified calendar day manager is incomplete')
          if '#calendar #calendarClassDetail' not in css or '#dashboard #operationsDashboard' not in css:
              raise SystemExit('Duplicate legacy surfaces are not suppressed')
          if "validCategories=['빵류','디저트류','케이크류']" not in refine or 'data-quick-paid' not in refine:
              raise SystemExit('Workspace refinement for recipe categories and participant payments is incomplete')
          if 'pastPaymentException' not in refine or 'renderOperatingFlow' not in refine or 'renderCostBreakdown' not in refine or 'renderProfitBars' not in refine:
              raise SystemExit('Operating finance flow, expense mix, menu profit, or past-payment rule is incomplete')
          if '.finance-operating-chart' not in refine_css or '.finance-cost-bars' not in refine_css or '.finance-profit-bars' not in refine_css:
              raise SystemExit('Operating finance visual styles are incomplete')
          if 'usageCalc' not in recipe_costs or 'price_per_100g' not in recipe_costs or '재료별 계산 합계' not in recipe_costs:
              raise SystemExit('Recipe ingredient cost detail is incomplete')
          if 'classBreakdown' not in ledger or 'monthlyTable' not in ledger or 'menuBreakdown' not in ledger or 'rentBasis' not in ledger:
              raise SystemExit('Detailed class, monthly, rent, or menu finance breakdown is incomplete')
          if '.ledger-month-table' not in ledger_css or '.ledger-formula' not in ledger_css or '.ledger-menu-classes' not in ledger_css:
              raise SystemExit('Detailed finance ledger styles are incomplete')
          if '<button data-page="schedule">' in html or '<button data-page="planner">' in html:
              raise SystemExit('Duplicate planner/schedule navigation reintroduced')
          if Path('docs/index.html').exists():
              raise SystemExit('Obsolete duplicate docs/index.html must not be restored')
          print('Role-owned tabs, recipe costing, and detailed operating finance ledger guard passed')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
