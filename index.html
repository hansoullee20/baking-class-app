<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#382920">
<title>베이킹 운영 관리</title>
<style>
:root{--bg:#f6f3ee;--paper:#fff;--ink:#2b241f;--muted:#7b7169;--line:#e7ded6;--brand:#382920;--brand2:#76513a;--bad:#a44b42;--shadow:0 8px 26px rgba(53,38,29,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif}.wrap{max-width:520px;margin:0 auto;padding:24px 16px}.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.hero small{font-size:10px;letter-spacing:.12em;opacity:.72;font-weight:800}.hero h1{margin:6px 0 5px;font-size:25px}.hero p{font-size:12px;opacity:.82;line-height:1.55;margin:0}.card{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px}button{width:100%;margin-top:9px;border:0;border-radius:11px;padding:12px;background:var(--brand);color:#fff;font-weight:800;font-size:14px}.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px}.status{font-size:12px;font-weight:700;margin-top:10px}.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><small>BRANCH · BAKING CLASS OPERATIONS</small><h1>베이킹 운영 관리</h1><p>공개 페이지에는 운영 데이터가 저장되지 않습니다. 각자 본인의 GitHub 연결 키로 비공개 운영 저장소에 접속합니다.</p></div>
  <div class="card" id="loginCard">
    <label for="token">GitHub 연결 키</label>
    <input id="token" type="password" placeholder="본인 토큰을 입력하세요" autocomplete="off">
    <button id="openBtn">운영 화면 열기</button>
    <div id="status" class="status"></div>
    <div class="note">연결 키는 이 휴대폰 브라우저의 로컬 저장소에만 저장됩니다. 서로의 토큰을 공유하지 마세요.</div>
  </div>
</div>
<script>
const TOKEN_KEY='baking-ops-github-token';
const OWNER='hansoullee20', REPO='baking-class-ops', BRANCH='main';
const tokenInput=document.getElementById('token');
const statusEl=document.getElementById('status');
const remembered=localStorage.getItem(TOKEN_KEY)||'';
if(remembered) tokenInput.value=remembered;
function decode64(s){const bytes=Uint8Array.from(atob(String(s).replace(/\n/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
async function openApp(){
  const token=tokenInput.value.trim();
  if(!token){statusEl.textContent='GitHub 연결 키를 입력하세요.';statusEl.className='status bad';return}
  statusEl.textContent='운영 화면을 불러오는 중…';statusEl.className='status';
  try{
    const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/index.html?ref=${encodeURIComponent(BRANCH)}`;
    const r=await fetch(url,{headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});
    if(!r.ok) throw new Error(r.status===401?'토큰이 올바르지 않습니다.':r.status===403?'이 계정에 저장소 접근 권한이 없습니다.':`GitHub 오류 ${r.status}`);
    const file=await r.json();
    const html=decode64(file.content);
    localStorage.setItem(TOKEN_KEY,token);
    document.open();document.write(html);document.close();
  }catch(e){statusEl.textContent=e.message;statusEl.className='status bad'}
}
document.getElementById('openBtn').addEventListener('click',openApp);
tokenInput.addEventListener('keydown',e=>{if(e.key==='Enter')openApp()});
if(remembered) openApp();
</script>
</body>
</html>
