<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#382920">
<title>베이킹 운영 관리</title>
<style>
:root{--bg:#f6f3ee;--paper:#fff;--ink:#2b241f;--muted:#776d66;--line:#e5dbd2;--brand:#382920;--bad:#a44b42;--ok:#2f7356;--shadow:0 8px 26px rgba(53,38,29,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:520px;margin:auto;padding:24px 16px}.hero{background:linear-gradient(135deg,#382920,#76513a);color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.hero h1{margin:4px 0 6px;font-size:25px}.hero p{margin:0;font-size:12px;opacity:.82;line-height:1.6}.card{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px}button{width:100%;border:0;border-radius:11px;padding:12px;background:var(--brand);color:#fff;font-weight:850;font-size:14px;margin-top:9px}.status{font-size:12px;font-weight:750;margin-top:10px;line-height:1.5}.bad{color:var(--bad)}.ok{color:var(--ok)}.note{font-size:10px;color:var(--muted);line-height:1.55;margin-top:9px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);z-index:99}
</style>
</head>
<body>
<div class="wrap" id="login">
  <div class="hero"><h1>베이킹 운영 관리</h1><p>항상 private 운영 저장소의 최신 대시보드를 직접 불러옵니다.</p></div>
  <div class="card">
    <label for="token">GitHub 연결 키</label>
    <input id="token" type="password" placeholder="본인 토큰 입력" autocomplete="off">
    <button id="openBtn">최신 대시보드 열기</button>
    <div id="status" class="status"></div>
    <div class="note">토큰은 이 브라우저에만 저장됩니다. private 운영 데이터는 공개 저장소에 복사하지 않습니다.</div>
  </div>
</div>
<script>
const KEY='baking-ops-github-token', OWNER='hansoullee20', REPO='baking-class-ops', BRANCH='main';
const tokenEl=document.getElementById('token'), statusEl=document.getElementById('status');
const saved=localStorage.getItem(KEY)||''; if(saved) tokenEl.value=saved;
function decode64(s){const bytes=Uint8Array.from(atob(String(s).replace(/\n/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
async function openLatest(){
 const token=tokenEl.value.trim();
 if(!token){statusEl.textContent='GitHub 연결 키를 입력하세요.';statusEl.className='status bad';return}
 statusEl.textContent='최신 운영 대시보드를 불러오는 중…';statusEl.className='status';
 try{
   const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/index.html?ref=${encodeURIComponent(BRANCH)}&t=${Date.now()}`;
   const r=await fetch(url,{headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});
   if(!r.ok) throw new Error(r.status===401?'토큰 인증 실패 (401)':r.status===403?'저장소 권한 없음 (403)':r.status===404?'private 저장소 또는 토큰 Repository access 확인 (404)':`GitHub 오류 ${r.status}`);
   const file=await r.json();
   const html=decode64(file.content||'');
   if(!html.includes('<html')) throw new Error('대시보드 HTML을 읽지 못했습니다.');
   localStorage.setItem(KEY,token);
   statusEl.textContent='최신 대시보드 연결 완료';statusEl.className='status ok';
   const frame=document.createElement('iframe');
   frame.title='베이킹 운영 관리';
   frame.srcdoc=html;
   document.body.appendChild(frame);
 }catch(e){statusEl.textContent=e.message;statusEl.className='status bad'}
}
document.getElementById('openBtn').addEventListener('click',openLatest);
tokenEl.addEventListener('keydown',e=>{if(e.key==='Enter')openLatest()});
if(saved) openLatest();
</script>
</body>
</html>
